<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #262727;
      min-height: 100vh;
      padding: 32px 16px;
      color: #1e293b;
      line-height: 1.6;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
    }

    .card {
      background: #302f2f;
      border: 1px solid #e8edf2;
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 16px;
    }

    /* Header */
    .app-title {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 2px;
      color: #ffffff;
    }

    .app-subtitle {
      font-size: 13px;
      color: #94a3b8;
    }

    /* Section headings */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 16px;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .stat {
      background: #535353;
      border-radius: 8px;
      padding: 14px 16px;
    }

    .stat-label {
      font-size: 11px;
      color: #fefeff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 26px;
      font-weight: 500;
      color: #ffffff;
    }

    /* Form */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      font-size: 12px;
      color: #ffffff;
    }

    input, select {
      padding: 9px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      background: #f8fafc;
      color: #1e293b;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.2);
      background: #ffffff;
    }

    input::placeholder {
      color: #404244;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Buttons */
    .btn-primary {
      background: #1e293b;
      color: #ffffff;
      border: none;
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: #0f172a;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid #e2e8f0;
      color: #64748b;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-ghost:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .btn-danger {
      background: transparent;
      border: 1px solid #fecaca;
      color: #ef4444;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-danger:hover {
      background: #fef2f2;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 16px;
    }

    /* Tasks */
    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid #e8edf2;
      border-radius: 8px;
      background: #ffffff;
      margin-bottom: 8px;
      transition: border-color 0.15s;
    }

    .task-item:last-child {
      margin-bottom: 0;
    }

    .task-item:hover {
      border-color: #cbd5e1;
    }

    .task-item.done {
      background: #f8fafc;
      border-color: #e8edf2;
    }

    .task-item.done .task-name {
      color: #94a3b8;
      text-decoration: line-through;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-name {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #0f172a;
    }

    .task-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 99px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .pill-high  { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .pill-med   { background: #fffbeb; color: #92400e; border-color: #fde68a; }
    .pill-low   { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
    .pill-cat   { background: #f1f5f9; color: #64748b; border-color: #e2e8f0; }
    .pill-time  { background: #f1f5f9; color: #64748b; border-color: #e2e8f0; }

    .task-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 36px;
      color: #94a3b8;
      font-size: 13px;
      border: 1px dashed #e2e8f0;
      border-radius: 8px;
    }

    /* Notifications */
    #notif-wrap {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .notif {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 13px;
      color: #1e293b;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      animation: slideIn 0.2s ease;
    }

    .notif.success { border-left: 3px solid #22c55e; }
    .notif.error   { border-left: 3px solid #ef4444; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .task-item { flex-direction: column; align-items: flex-start; }
      .task-actions { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="card">
      <h1 class="app-title">Task manager</h1>
      <p class="app-subtitle">Frontend connected to backend API</p>
    </div>

    <div class="card">
      <p class="section-label">Overview</p>
      <div class="stats">
        <div class="stat"><div class="stat-label">Total</div><div class="stat-val" id="s-total">0</div></div>
        <div class="stat"><div class="stat-label">Completed</div><div class="stat-val" id="s-done">0</div></div>
        <div class="stat"><div class="stat-label">Pending</div><div class="stat-val" id="s-pending">0</div></div>
        <div class="stat"><div class="stat-label">Rate</div><div class="stat-val" id="s-rate">0%</div></div>
      </div>
    </div>

    <div class="card">
      <p class="section-label">New task</p>
      <div class="form-group">
        <label for="ti">Task description</label>
        <input id="ti" type="text" placeholder="What needs to be done?" />
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label for="cat">Category</label>
          <select id="cat"><option value="">Loading…</option></select>
        </div>
        <div class="form-group">
          <label for="pri">Priority</label>
          <select id="pri">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="mins">Time estimate (minutes, optional)</label>
        <input id="mins" type="number" placeholder="e.g. 30" min="0" />
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="submit-btn">Add task</button>
        <button class="btn-ghost" id="cancel-btn" style="display:none">Cancel</button>
      </div>
    </div>

    <div class="card">
      <p class="section-label">Filter & search</p>
      <div class="form-grid">
        <div class="form-group">
          <label for="filter">Category</label>
          <select id="filter"><option value="All">All categories</option></select>
        </div>
        <div class="form-group">
          <label for="search">Search</label>
          <input id="search" type="text" placeholder="Search tasks…" />
        </div>
      </div>
    </div>

    <div class="card">
      <p class="section-label">Your tasks</p>
      <div id="task-list">
        <div class="empty">No tasks yet. Create one to get started!</div>
      </div>
    </div>

  </div>

  <div id="notif-wrap"></div>

  <script>
    const BASE = 'https://sia-finals-main-2.onrender.com';
    let tasks = [], cats = [], editId = null, activeTimer = null, timerIv = null;

    const $ = id => document.getElementById(id);
    const ti = $('ti'), catSel = $('cat'), priSel = $('pri'), minsSel = $('mins');
    const filterSel = $('filter'), searchIn = $('search');
    const taskList = $('task-list'), submitBtn = $('submit-btn'), cancelBtn = $('cancel-btn');

    async function init() {
      await loadCats();
      if (!cats.length) { await seedCats(); await loadCats(); }
      await loadTasks();
    }

    async function seedCats() {
      for (const n of ['General', 'Work', 'Personal']) {
        try {
          await fetch(`${BASE}/categories`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: n })
          });
        } catch(e) {}
      }
    }

    async function loadCats() {
      try {
        const r = await fetch(`${BASE}/categories`);
        const d = await r.json();
        if (d.success) { cats = d.data; fillCatDrops(); }
      } catch(e) { notify('Could not load categories', 'error'); }
    }

    function fillCatDrops() {
      catSel.innerHTML = '';
      filterSel.innerHTML = '<option value="All">All categories</option>';
      cats.forEach(c => {
        catSel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
        filterSel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
      });
    }

    async function loadTasks() {
      try {
        const r = await fetch(`${BASE}/tasks`);
        const d = await r.json();
        if (d.success) {
          tasks = d.data.map(t => ({
            ...t,
            completed: !!t.completed,
            original_time: t.original_time || 0,
            remaining_time: t.remaining_time || 0
          }));
          render();
          stats();
        }
      } catch(e) { notify('Could not load tasks', 'error'); }
    }

    submitBtn.addEventListener('click', async () => {
      const text = ti.value.trim();
      if (!text) { notify('Task cannot be empty', 'error'); return; }
      const secs = minsSel.value ? parseInt(minsSel.value) * 60 : 0;
      if (editId) {
        await doPut(editId, { text, category_id: catSel.value, priority: priSel.value, original_time: secs });
      } else {
        await doPost({ text, category_id: catSel.value, priority: priSel.value, original_time: secs, remaining_time: secs });
      }
    });

    cancelBtn.addEventListener('click', () => {
      editId = null;
      ti.value = '';
      minsSel.value = '';
      submitBtn.textContent = 'Add task';
      cancelBtn.style.display = 'none';
    });

    filterSel.addEventListener('change', render);
    searchIn.addEventListener('input', render);

    async function doPost(body) {
      try {
        const r = await fetch(`${BASE}/tasks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const d = await r.json();
        if (d.success) {
          notify('Task added!', 'success');
          ti.value = '';
          minsSel.value = '';
          await loadTasks();
        } else {
          notify(d.message || 'Error adding task', 'error');
        }
      } catch(e) { notify('Error adding task', 'error'); }
    }

    async function doPut(id, body) {
      try {
        const ex = tasks.find(t => t.id === id);
        const payload = {
          ...body,
          remaining_time: body.original_time > 0 ? body.original_time : (ex ? ex.remaining_time : 0)
        };
        const r = await fetch(`${BASE}/tasks/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const d = await r.json();
        if (d.success) {
          notify('Task updated!', 'success');
          editId = null;
          submitBtn.textContent = 'Add task';
          cancelBtn.style.display = 'none';
          ti.value = '';
          minsSel.value = '';
          await loadTasks();
        } else {
          notify(d.message || 'Error updating task', 'error');
        }
      } catch(e) { notify('Error updating task', 'error'); }
    }

    async function toggleDone(id) {
      try {
        await fetch(`${BASE}/tasks/${id}/toggle`, { method: 'PATCH' });
        await loadTasks();
      } catch(e) {}
    }

    async function delTask(id) {
      if (!confirm('Delete this task?')) return;
      try {
        const r = await fetch(`${BASE}/tasks/${id}`, { method: 'DELETE' });
        const d = await r.json();
        if (d.success) {
          if (activeTimer === id) stopTimer();
          await loadTasks();
          notify('Task deleted', 'success');
        }
      } catch(e) {}
    }

    function editTask(id) {
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      editId = id;
      ti.value = t.text;
      catSel.value = t.category_id;
      priSel.value = t.priority;
      minsSel.value = t.original_time ? Math.round(t.original_time / 60) : '';
      submitBtn.textContent = 'Save changes';
      cancelBtn.style.display = 'inline-block';
      ti.focus();
    }

    function startTimer(id) {
      const t = tasks.find(x => x.id === id);
      if (!t || t.completed || t.remaining_time <= 0) return;
      if (timerIv) stopTimer();
      activeTimer = id;
      timerIv = setInterval(async () => {
        const cur = tasks.find(x => x.id === id);
        if (!cur || cur.remaining_time <= 0) {
          stopTimer();
          notify('Timer done!', 'success');
          return;
        }
        cur.remaining_time -= 1;
        render();
        if (cur.remaining_time % 10 === 0 || cur.remaining_time === 0) {
          await syncTimer(cur);
        }
      }, 1000);
      render();
    }

    async function pauseTimer(id) {
      const t = tasks.find(x => x.id === id);
      if (t) await syncTimer(t);
      stopTimer();
      notify('Timer paused', 'success');
    }

    function stopTimer() {
      clearInterval(timerIv);
      timerIv = null;
      activeTimer = null;
      render();
    }

    async function syncTimer(t) {
      try {
        await fetch(`${BASE}/tasks/${t.id}/timer`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ remaining_time: t.remaining_time })
        });
      } catch(e) {}
    }

    function fmt(s) {
      return `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s`;
    }

    function render() {
      const fv = filterSel.value;
      const sv = searchIn.value.toLowerCase();
      const filtered = tasks.filter(t =>
        (fv === 'All' || !fv || t.category_id === fv) &&
        t.text.toLowerCase().includes(sv)
      );

      if (!filtered.length) {
        taskList.innerHTML = '<div class="empty">No tasks found.</div>';
        return;
      }

      taskList.innerHTML = filtered.map(t => {
        const cat = cats.find(c => c.id === t.category_id);
        const pc = t.priority === 'High' ? 'pill-high' : t.priority === 'Low' ? 'pill-low' : 'pill-med';
        const timerBtn = (!t.completed && t.remaining_time > 0)
          ? `<button class="btn-ghost" onclick="window._tt('${t.id}')">${activeTimer === t.id ? 'Pause' : 'Start timer'}</button>`
          : '';
        return `
          <div class="task-item ${t.completed ? 'done' : ''}">
            <div class="task-content">
              <div class="task-name">${t.text}</div>
              <div class="task-meta">
                <span class="pill ${pc}">${t.priority}</span>
                ${cat ? `<span class="pill pill-cat">${cat.name}</span>` : ''}
                ${t.original_time > 0 ? `<span class="pill pill-time">&#9201; ${Math.round(t.original_time / 60)}m</span>` : ''}
                ${t.remaining_time > 0 ? `<span class="pill pill-time">${fmt(t.remaining_time)} left</span>` : ''}
              </div>
            </div>
            <div class="task-actions">
              ${timerBtn}
              <button class="btn-ghost" onclick="window._et('${t.id}')">Edit</button>
              <button class="btn-ghost" onclick="window._td('${t.id}')">${t.completed ? 'Undo' : 'Done'}</button>
              <button class="btn-danger" onclick="window._dt('${t.id}')">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window._tt = id => activeTimer === id ? pauseTimer(id) : startTimer(id);
    window._et = editTask;
    window._td = toggleDone;
    window._dt = delTask;

    function stats() {
      const done = tasks.filter(t => t.completed).length;
      $('s-total').textContent   = tasks.length;
      $('s-done').textContent    = done;
      $('s-pending').textContent = tasks.length - done;
      $('s-rate').textContent    = tasks.length ? Math.round(done / tasks.length * 100) + '%' : '0%';
    }

    function notify(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `notif ${type}`;
      el.textContent = msg;
      $('notif-wrap').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    init();
  </script>
</body>
</html>
